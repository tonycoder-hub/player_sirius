name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pre-push-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Run Pre Push Check
        run: |
          bash scripts/pre-push-check.sh
